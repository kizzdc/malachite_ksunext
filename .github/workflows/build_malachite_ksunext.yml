name: Malachite - GKI 6.1.78 KSU Next (NO SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_malachite_ksunext.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    name: Build GKI r4 + KernelSU Next v3.4.2
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl python3 ca-certificates build-essential zip
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync pinned GKI and integrate KernelSU Next
        run: bash scripts/prepare_source.sh

      - name: Build GKI kernel
        run: bash scripts/build_kernel.sh

      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malachite-gki-6.1.78-r4-ksunext-3.4.2
          path: |
            gki/dist/Image
            gki/dist/Image.lz4
            gki/dist/Image.gz
            gki/build-verification.txt
            gki/build.log
          if-no-files-found: warn
          retention-days: 14
